<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLab - 로그인 / 회원가입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-elevated: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: rgba(37, 99, 235, 0.1);
            --positive: #ef4444;
            --success: #10b981;
            --shadow-md: 0 10px 25px -5px rgb(0 0 0 / 0.08);
        }

        body.dark-mode {
            --bg-body: #0b0f19;
            --bg-surface: #131b2e;
            --bg-elevated: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: rgba(59, 130, 246, 0.15);
            --shadow-md: 0 10px 25px -5px rgb(0 0 0 / 0.45);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .theme-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            width: 62px;
            height: 32px;
            padding: 3px;
            border-radius: 9999px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .theme-switch:hover {
            border-color: var(--accent-primary);
        }

        .theme-switch-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-surface);
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode .theme-switch-thumb {
            transform: translateX(30px);
        }

        .theme-switch-icon {
            position: relative;
            z-index: 1;
            width: 24px;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1;
            user-select: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .auth-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.4rem;
            background: var(--bg-elevated);
            padding: 0.35rem;
            border-radius: 10px;
            margin-bottom: 1.4rem;
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.86rem;
            font-weight: 700;
            padding: 0.55rem 0.4rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--accent-primary);
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }

        .password-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 0.72rem 0.9rem;
            border-radius: 9px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .password-wrap .form-input {
            padding-right: 2.6rem;
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .form-input:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-inline {
            flex-shrink: 0;
            padding: 0 0.9rem;
            border-radius: 9px;
            border: 1px solid var(--border-color);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-inline:hover:not(:disabled) {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .btn-inline:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-eye {
            position: absolute;
            right: 0.55rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .btn-eye:hover {
            color: var(--text-primary);
        }

        .field-msg {
            margin-top: 0.38rem;
            font-size: 0.78rem;
            line-height: 1.4;
            min-height: 1.1rem;
            color: var(--text-muted);
        }

        .field-msg.error { color: var(--positive); }
        .field-msg.success { color: var(--success); }

        .pw-rules {
            margin-top: 0.42rem;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            background: var(--bg-elevated);
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            font-size: 0.76rem;
            color: var(--text-secondary);
        }

        .pw-rule {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .pw-rule.ok {
            color: var(--success);
            font-weight: 600;
        }

        .pw-rule.bad {
            color: var(--positive);
        }

        .btn-submit {
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            background: var(--accent-primary);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-submit:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .browse-divider {
            margin: 1.25rem 0 0.85rem;
            border-top: 1px solid var(--border-color);
        }

        .browse-link {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.72rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: border-color 0.15s, color 0.15s;
        }

        .browse-link:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .status-msg {
            margin-top: 0.9rem;
            font-size: 0.84rem;
            min-height: 1.25rem;
            text-align: center;
        }

        .status-msg.error { color: var(--positive); }
        .status-msg.success { color: var(--success); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">S</div>
            <div class="logo-title">StockLab</div>
        </div>
        <button type="button" class="theme-switch" id="themeToggleBtn" aria-label="테마 전환" title="라이트 / 다크 모드 전환">
            <span class="theme-switch-thumb"></span>
            <span class="theme-switch-icon">☀️</span>
            <span class="theme-switch-icon">🌙</span>
        </button>
    </header>

    <main>
        <section class="auth-card">
            <h1 class="auth-title">StockLab 시작하기</h1>
            <p class="auth-subtitle">로그인 세션으로 대시보드·모의투자·마이페이지가 연결됩니다.</p>

            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="login">로그인</button>
                <button type="button" class="tab-btn" data-tab="register">회원가입</button>
            </div>

            <!-- 1. 로그인 -->
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginIdInput">아이디</label>
                    <input type="text" class="form-input" id="loginIdInput" placeholder="아이디 입력" autocomplete="username" required>
                    <p class="field-msg" id="loginIdMsg"></p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPwInput">비밀번호</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="loginPwInput" placeholder="비밀번호 입력" autocomplete="current-password" required>
                        <button type="button" class="btn-eye" data-toggle-pw="loginPwInput" aria-label="비밀번호 표시 전환" title="비밀번호 보기">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="field-msg" id="loginPwMsg"></p>
                </div>
                <button type="submit" class="btn-submit" id="loginSubmitBtn">로그인</button>
            </form>

            <!-- 2. 회원가입 -->
            <form id="registerForm" class="hidden" novalidate>
                <div class="form-group">
                    <label class="form-label" for="regIdInput">아이디 (공백 없이 3~50자)</label>
                    <div class="input-row">
                        <input type="text" class="form-input" id="regIdInput" placeholder="사용할 아이디" minlength="3" maxlength="50" autocomplete="username" required>
                        <button type="button" class="btn-inline" id="checkIdBtn">중복확인</button>
                    </div>
                    <p class="field-msg" id="regIdMsg">아이디 중복확인을 완료해야 다음 입력이 활성화됩니다.</p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="regNickInput">닉네임</label>
                    <input type="text" class="form-input" id="regNickInput" placeholder="표시될 닉네임 (1~50자)" maxlength="50" disabled required>
                    <p class="field-msg" id="regNickMsg"></p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPwInput">비밀번호</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="regPwInput" placeholder="비밀번호 입력" minlength="8" maxlength="64" autocomplete="new-password" required>
                        <button type="button" class="btn-eye" data-toggle-pw="regPwInput" aria-label="비밀번호 표시 전환" title="비밀번호 보기">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="pw-rules" id="pwRulesBox">
                        <span class="pw-rule" id="ruleLen">• 8~64자 이내</span>
                        <span class="pw-rule" id="ruleMix">• 영문, 숫자, 특수문자 각각 1자 이상 포함</span>
                        <span class="pw-rule" id="ruleSpace">• 공백 사용 불가</span>
                    </div>
                    <p class="field-msg" id="regPwMsg"></p>
                </div>
                <button type="submit" class="btn-submit" id="regSubmitBtn" disabled>회원가입 후 시작</button>
            </form>

            <div class="browse-divider"></div>
            <a href="/Dashboard/index.html" class="browse-link">로그인 없이 페이지 둘러보기 →</a>

            <p class="status-msg" id="authStatusMsg"></p>
        </section>
    </main>

    <script src="/client-config.js"></script>
    <script>
        const buildServerUrl = (path) => `${window.STOCKLAB_SERVER_URL || ''}${path}`;
        const authStatusMsg = document.getElementById('authStatusMsg');

        const EYE_OPEN_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        // 테마 초기화
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if ((localStorage.getItem('stocklab-theme') || 'light') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('stocklab-theme', isDark ? 'dark' : 'light');
        });

        // 이미 유효한 로그인 세션이 있으면 대시보드로 즉시 이동
        (async function checkExistingSession() {
            try {
                const res = await fetch(buildServerUrl('/api/auth/me'), { credentials: 'include' });
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.success) {
                        window.location.replace('/Dashboard/index.html');
                    }
                }
            } catch {
                // 서버 미연결 시 대문 페이지 유지
            }
        })();

        // 비밀번호 보이기/숨기기 눈 버튼 전환
        document.querySelectorAll('[data-toggle-pw]').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.togglePw);
                const show = target.type === 'password';
                target.type = show ? 'text' : 'password';
                btn.innerHTML = show ? EYE_OFF_SVG : EYE_OPEN_SVG;
                btn.title = show ? '비밀번호 숨기기' : '비밀번호 보기';
            });
        });

        // 탭 전환
        const tabButtons = document.querySelectorAll('.tab-btn');
        const forms = {
            login: document.getElementById('loginForm'),
            register: document.getElementById('registerForm')
        };

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.tab;
                tabButtons.forEach(b => b.classList.toggle('active', b === btn));
                Object.entries(forms).forEach(([key, form]) => form.classList.toggle('hidden', key !== target));
                authStatusMsg.textContent = '';
                authStatusMsg.className = 'status-msg';
            });
        });

        function setFieldMsg(el, text, state = '') {
            el.textContent = text;
            el.className = state ? `field-msg ${state}` : 'field-msg';
        }

        // === 회원가입 입력 검증 & 아이디 중복확인 ===
        const regIdInput = document.getElementById('regIdInput');
        const checkIdBtn = document.getElementById('checkIdBtn');
        const regIdMsg = document.getElementById('regIdMsg');
        const regNickInput = document.getElementById('regNickInput');
        const regNickMsg = document.getElementById('regNickMsg');
        const regPwInput = document.getElementById('regPwInput');
        const regPwMsg = document.getElementById('regPwMsg');
        const regSubmitBtn = document.getElementById('regSubmitBtn');
        const ruleLen = document.getElementById('ruleLen');
        const ruleMix = document.getElementById('ruleMix');
        const ruleSpace = document.getElementById('ruleSpace');

        let verifiedLoginId = '';

        function evaluatePassword(pw) {
            const lenOk = pw.length >= 8 && pw.length <= 64;
            const hasLetter = /[A-Za-z]/.test(pw);
            const hasDigit = /\d/.test(pw);
            const hasSpecial = /[^A-Za-z0-9\s]/.test(pw);
            const mixOk = hasLetter && hasDigit && hasSpecial;
            const spaceOk = pw.length > 0 && !/\s/.test(pw);
            return { lenOk, mixOk, spaceOk, valid: lenOk && mixOk && spaceOk };
        }

        function updatePasswordRulesUI() {
            const pw = regPwInput.value;
            if (!pw) {
                ruleLen.textContent = '• 8~64자 이내';
                ruleMix.textContent = '• 영문, 숫자, 특수문자 각각 1자 이상 포함';
                ruleSpace.textContent = '• 공백 사용 불가';
                ruleLen.className = 'pw-rule';
                ruleMix.className = 'pw-rule';
                ruleSpace.className = 'pw-rule';
                setFieldMsg(regPwMsg, '');
                return false;
            }

            const res = evaluatePassword(pw);
            ruleLen.textContent = `${res.lenOk ? '✓' : '✗'} 8~64자 이내`;
            ruleMix.textContent = `${res.mixOk ? '✓' : '✗'} 영문, 숫자, 특수문자 각각 1자 이상 포함`;
            ruleSpace.textContent = `${res.spaceOk ? '✓' : '✗'} 공백 사용 불가`;
            ruleLen.className = `pw-rule ${res.lenOk ? 'ok' : 'bad'}`;
            ruleMix.className = `pw-rule ${res.mixOk ? 'ok' : 'bad'}`;
            ruleSpace.className = `pw-rule ${res.spaceOk ? 'ok' : 'bad'}`;

            if (res.valid) {
                setFieldMsg(regPwMsg, '사용 가능한 비밀번호입니다.', 'success');
            } else {
                setFieldMsg(regPwMsg, '비밀번호 생성 규칙을 모두 충족해 주세요.', 'error');
            }
            return res.valid;
        }

        function syncRegisterGate() {
            const idChecked = Boolean(verifiedLoginId) && regIdInput.value.trim() === verifiedLoginId;
            regNickInput.disabled = !idChecked;
            regSubmitBtn.disabled = !idChecked;
        }

        regIdInput.addEventListener('input', () => {
            if (verifiedLoginId !== regIdInput.value.trim()) {
                verifiedLoginId = '';
                setFieldMsg(regIdMsg, '아이디 중복확인을 완료해야 다음 입력이 활성화됩니다.');
            }
            syncRegisterGate();
        });

        regPwInput.addEventListener('input', updatePasswordRulesUI);

        checkIdBtn.addEventListener('click', async () => {
            const loginId = regIdInput.value.trim();
            if (loginId.length < 3 || loginId.length > 50 || /\s/.test(loginId)) {
                verifiedLoginId = '';
                syncRegisterGate();
                setFieldMsg(regIdMsg, '아이디는 공백 없이 3~50자 사이로 입력해 주세요.', 'error');
                return;
            }

            checkIdBtn.disabled = true;
            setFieldMsg(regIdMsg, '중복 확인 중...');

            try {
                const res = await fetch(buildServerUrl(`/api/auth/check-id?loginId=${encodeURIComponent(loginId)}`), {
                    credentials: 'include'
                });
                const json = await res.json();
                if (!res.ok || !json.success) {
                    verifiedLoginId = '';
                    setFieldMsg(regIdMsg, json?.error?.message || '중복 확인에 실패했습니다.', 'error');
                } else if (json.data.available) {
                    verifiedLoginId = loginId;
                    setFieldMsg(regIdMsg, json.data.message || '사용 가능한 아이디입니다.', 'success');
                } else {
                    verifiedLoginId = '';
                    setFieldMsg(regIdMsg, json.data.message || '이미 사용 중인 아이디입니다.', 'error');
                }
            } catch {
                verifiedLoginId = '';
                setFieldMsg(regIdMsg, '서버에 연결할 수 없어 중복확인을 진행하지 못했습니다.', 'error');
            } finally {
                checkIdBtn.disabled = false;
                syncRegisterGate();
                if (verifiedLoginId) {
                    regNickInput.focus();
                }
            }
        });

        // === 로그인 제출 ===
        const loginIdInput = document.getElementById('loginIdInput');
        const loginPwInput = document.getElementById('loginPwInput');
        const loginIdMsg = document.getElementById('loginIdMsg');
        const loginPwMsg = document.getElementById('loginPwMsg');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');

        forms.login.addEventListener('submit', async (e) => {
            e.preventDefault();
            setFieldMsg(loginIdMsg, '');
            setFieldMsg(loginPwMsg, '');
            authStatusMsg.textContent = '';

            const loginId = loginIdInput.value.trim();
            const password = loginPwInput.value;

            if (!loginId) {
                setFieldMsg(loginIdMsg, '아이디를 입력해 주세요.', 'error');
                loginIdInput.focus();
                return;
            }
            if (!password) {
                setFieldMsg(loginPwMsg, '비밀번호를 입력해 주세요.', 'error');
                loginPwInput.focus();
                return;
            }

            loginSubmitBtn.disabled = true;
            try {
                const res = await fetch(buildServerUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ loginId, password })
                });
                const json = await res.json();
                if (!res.ok || !json.success) {
                    setFieldMsg(loginPwMsg, json?.error?.message || '아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
                    return;
                }

                authStatusMsg.textContent = '로그인 성공! 대시보드로 이동합니다.';
                authStatusMsg.className = 'status-msg success';
                window.location.replace('/Dashboard/index.html');
            } catch {
                authStatusMsg.textContent = '중앙 서버에 연결할 수 없습니다. Server 실행 상태를 확인해 주세요.';
                authStatusMsg.className = 'status-msg error';
            } finally {
                loginSubmitBtn.disabled = false;
            }
        });

        // === 회원가입 제출 ===
        forms.register.addEventListener('submit', async (e) => {
            e.preventDefault();
            setFieldMsg(regNickMsg, '');
            authStatusMsg.textContent = '';

            const loginId = regIdInput.value.trim();
            const nickname = regNickInput.value.trim();
            const password = regPwInput.value;

            if (!verifiedLoginId || loginId !== verifiedLoginId) {
                setFieldMsg(regIdMsg, '아이디 중복확인을 먼저 완료해 주세요.', 'error');
                syncRegisterGate();
                return;
            }
            if (!nickname || nickname.length > 50) {
                setFieldMsg(regNickMsg, '닉네임은 1~50자 사이로 입력해 주세요.', 'error');
                regNickInput.focus();
                return;
            }
            if (!updatePasswordRulesUI()) {
                regPwInput.focus();
                return;
            }

            regSubmitBtn.disabled = true;
            try {
                const res = await fetch(buildServerUrl('/api/auth/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ loginId, nickname, password })
                });
                const json = await res.json();
                if (!res.ok || !json.success) {
                    const msg = json?.error?.message || '회원가입에 실패했습니다.';
                    if (res.status === 409 || msg.includes('아이디')) {
                        verifiedLoginId = '';
                        setFieldMsg(regIdMsg, msg, 'error');
                        syncRegisterGate();
                    } else if (msg.includes('비밀번호')) {
                        setFieldMsg(regPwMsg, msg, 'error');
                    } else if (msg.includes('닉네임')) {
                        setFieldMsg(regNickMsg, msg, 'error');
                    } else {
                        authStatusMsg.textContent = msg;
                        authStatusMsg.className = 'status-msg error';
                    }
                    return;
                }

                authStatusMsg.textContent = '회원가입 완료! 대시보드로 이동합니다.';
                authStatusMsg.className = 'status-msg success';
                window.location.replace('/Dashboard/index.html');
            } catch {
                authStatusMsg.textContent = '중앙 서버에 연결할 수 없습니다. Server 실행 상태를 확인해 주세요.';
                authStatusMsg.className = 'status-msg error';
            } finally {
                syncRegisterGate();
            }
        });
    </script>
</body>
</html>
